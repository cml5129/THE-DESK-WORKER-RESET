[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exerset"
version = "1.0.0"
description = "Desktop app for desk workers to take movement breaks and build consistent movement habits."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Chris Lorenz", email = "cml5129@gmail.com" }
]
keywords = ["posture", "wellness", "movement", "desktop-app", "exercises", "breaks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/drjosh/exerset"
Repository = "https://github.com/drjosh/exerset.git"
Issues = "https://github.com/drjosh/exerset/issues"
Documentation = "https://github.com/drjosh/exerset#readme"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
]

[tool.setuptools]
packages = ["exerset", "exerset.ui"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
